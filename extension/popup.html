<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusPebble</title><link rel="stylesheet" href="style.css"></head><body><header><div><img src="icons/icon48.png" alt=""><h1>FocusPebble</h1></div><a class="brand-link" href="privacy.html" target="_blank">Help</a></header><main><div class="eyebrow">FOCUS TIMER</div><h2>Make room for one thing.</h2><p class="muted">A small timer for a single task. Close this popup; the timer keeps going.</p><div class="tabs"><button data-mode="focus" class="selected">Focus</button><button data-mode="short">Short break</button><button data-mode="long">Long break</button></div><div id="clock" class="clock" role="timer" aria-label="Time remaining">25:00</div><p class="center muted" id="timer-label">Ready when you are.</p><div class="row"><button id="start" class="primary">Start focus</button><button id="reset">Reset</button></div><section class="card"><div class="note-title"><h3>Today's focus</h3><span id="completed" class="count">0 sessions</span></div><p class="muted">Completed focus sessions count toward your daily total.</p><div class="row"><div><label for="focus-minutes">Focus minutes</label><input id="focus-minutes" type="number" min="1" max="120" value="25"></div><div><label for="break-minutes">Break minutes</label><input id="break-minutes" type="number" min="1" max="60" value="5"></div></div><button id="settings" class="small" style="margin-top:10px">Save durations</button></section><p id="status" class="status" role="status" aria-live="polite"></p></main><footer><span>Private by default · Stored locally</span><span>1.0.0</span></footer><script type="module" src="popup.js"></script></body></html>
