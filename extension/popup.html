<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusPet</title><link rel="stylesheet" href="style.css"></head><body><header><div><img src="icons/icon48.png" alt=""><h1>FocusPet</h1></div><a class="brand-link" href="privacy.html" target="_blank">Help</a></header><main><div class="eyebrow">SMALL FOCUS. HAPPY FRIEND.</div><div class="pet-scene" id="pet-scene"><div class="spark s1">✦</div><div class="spark s2">✧</div><img id="pet-image" src="pets/cat.svg" alt="Your focus companion"><span id="pet-accessory" aria-hidden="true"></span><div class="pet-shadow"></div><span class="pet-bubble" id="pet-bubble">Let's do one small thing.</span></div><div class="pet-info"><strong id="pet-name">Mochi</strong><span id="pet-level">Level 1 · Sleepy seedling</span></div><div class="growth"><div id="growth-bar"></div></div><div class="row"><span class="muted" id="growth-label">4 focus sessions to grow</span><button id="customize" class="quiet small">Choose friend</button></div><section id="custom-panel" class="card" hidden><label for="pet-kind">Your companion</label><div class="row"><select id="pet-kind"><option value="cat">Cat</option><option value="bunny">Bunny</option></select><input id="pet-name-input" maxlength="30" placeholder="Friend's name" aria-label="Companion name"><button id="save-pet" class="primary small">Save</button></div></section><p class="muted center" id="ready-hint">Mochi is ready. No setup needed.</p><div class="presets" aria-label="Focus duration"><button data-minutes="5">5 min</button><button data-minutes="15">15 min</button><button data-minutes="25" class="selected">25 min</button></div><div class="tabs" style="margin-top:12px"><button data-mode="focus" class="selected">Focus</button><button data-mode="short">Short break</button><button data-mode="long">Long break</button></div><div id="clock" class="clock" role="timer" aria-label="Time remaining">25:00</div><div class="row"><button id="start" class="primary">Start focus</button><button id="reset">Reset</button></div><button id="next-session" class="full" hidden>Take a 5-minute break</button><div class="daily-summary"><span id="completed">0 sessions today</span><span id="streak">A fresh start</span></div><details class="settings-details"><summary>Optional task, timer settings & progress</summary><label for="task">One thing to focus on (optional)</label><input id="task" maxlength="100" placeholder="You can start without writing anything"><div class="row"><div><label for="focus-minutes">Focus minutes</label><input id="focus-minutes" type="number" min="1" max="120" value="25"></div><div><label for="break-minutes">Break minutes</label><input id="break-minutes" type="number" min="1" max="60" value="5"></div></div><button id="settings" class="small" style="margin-top:10px">Save durations</button><div id="week" class="week"></div></details><p id="status" class="status" role="status" aria-live="polite"></p></main><footer><span>Private by default · Stored locally</span><span>1.2.0</span></footer><script type="module" src="popup.js"></script></body></html>
